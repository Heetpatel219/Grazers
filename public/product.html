<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Detail | Grazers</title>
  <link rel="stylesheet" href="home.css" />
  <style>
    .product-detail-layout {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px 40px;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.5fr);
      gap: 32px;
    }
    .product-detail-main img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.18);
      background: #f3f4f6;
    }
    .product-meta {
      margin-top: 16px;
    }
    .product-meta h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }
    .product-store {
      font-size: 0.95rem;
      color: #6b7280;
      margin-bottom: 6px;
    }
    .rating-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    .stars {
      color: #fbbf24;
      font-size: 1.1rem;
    }
    .price {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 12px 0;
    }
    .inventory {
      font-size: 0.9rem;
      color: #059669;
      margin-bottom: 16px;
    }
    .inventory.low {
      color: #ea580c;
    }
    .inventory.empty {
      color: #b91c1c;
    }
    .detail-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, #ec4899, #6366f1);
      border: none;
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
      background: #9ca3af;
    }
    .btn-secondary {
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #374151;
      font-weight: 500;
      cursor: pointer;
      min-width: 120px;
    }
    .btn-secondary.active {
      border-color: #f97316;
      color: #f97316;
      background: #fff7ed;
    }
    .detail-section {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }
    .detail-section h2 {
      margin: 0 0 12px;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #6b7280;
    }
    .reviews-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .review-card {
      padding: 14px 16px;
      border-radius: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .review-author {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .review-date {
      font-size: 0.8rem;
      color: #9ca3af;
    }
    .review-comment {
      font-size: 0.9rem;
      color: #4b5563;
    }
    .review-reply {
      margin-top: 8px;
      padding: 8px 10px;
      border-left: 3px solid #10b981;
      background: #ecfdf5;
      font-size: 0.85rem;
      color: #047857;
    }
    .related-grid {
      display: flex;
      gap: 14px;
      margin-top: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scroll-snap-type: x mandatory;
    }
    .related-card {
      flex: 0 0 180px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      background: #fff;
      cursor: pointer;
      scroll-snap-align: start;
    }
    .related-card-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .related-card-price {
      font-size: 0.85rem;
      color: #4b5563;
    }
    .small-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .detail-sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .panel {
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.18);
      padding: 18px 18px 20px;
      border: 1px solid #e5e7eb;
    }
    .panel h3 {
      margin: 0 0 8px;
      font-size: 1rem;
    }
    .panel p {
      margin: 4px 0;
      font-size: 0.9rem;
      color: #4b5563;
    }
    .review-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .review-form textarea {
      min-height: 70px;
      resize: vertical;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .star-rating {
      display: flex;
      gap: 4px;
      font-size: 1.5rem;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .star-rating .star {
      color: #d1d5db;
      transition: color 0.15s;
    }
    .star-rating .star.filled {
      color: #fbbf24;
    }
    .star-rating:hover .star {
      color: #fbbf24;
    }
    .star-rating .star:hover ~ .star {
      color: #d1d5db;
    }
    .related-card-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      background: #f3f4f6;
      margin-bottom: 8px;
    }
    .reserve-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    .reserve-modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .reserve-modal {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }
    .reserve-modal h3 { margin: 0 0 16px; font-size: 1.2rem; }
    .reserve-modal label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
    .reserve-modal input, .reserve-modal select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      margin-bottom: 14px;
      box-sizing: border-box;
    }
    .reserve-modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .reserve-modal-actions button { flex: 1; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; }
    .reserve-modal-actions .btn-cancel { background: #f3f4f6; color: #374151; }
    .reserve-modal-actions .btn-submit { background: linear-gradient(135deg, #ec4899, #6366f1); color: #fff; }
    .reservation-status-section { margin-top: 20px; padding: 16px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }
    .reservation-status-section h3 { margin: 0 0 10px; font-size: 1rem; }
    .reservation-status-list { display: flex; flex-direction: column; gap: 10px; }
    .reservation-status-item {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
      padding: 10px 12px; background: #fff; border-radius: 10px; border: 1px solid #e5e7eb;
    }
    .reservation-status-item .status-badge { padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
    .reservation-status-item .status-badge.pending { background: #fef3c7; color: #92400e; }
    .reservation-status-item .status-badge.confirmed { background: #d1fae5; color: #047857; }
    .reservation-status-item .status-badge.cancelled { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brandIcon">G</div>
      <div class="brandText">
        <div class="brandName">Grazers</div>
        <div class="brandTag">FASHION COLLECTION</div>
      </div>
    </div>
    <div class="topIcons">
      <a class="topLink" href="/">← Back to products</a>
    </div>
  </header>

  <main class="product-detail-layout">
    <section class="product-detail-main">
      <img id="productImage" src="" alt="Product image">
      <div class="product-meta">
        <p class="small-tag" id="productCategoryTag"></p>
        <h1 id="productTitle">Loading…</h1>
        <p class="product-store" id="productStore"></p>
        <div class="rating-row">
          <span id="productRatingStars" class="stars"></span>
          <span id="productRatingText"></span>
          <span id="storeRatingText"></span>
        </div>
        <div class="price" id="productPrice"></div>
        <div class="inventory" id="inventoryText"></div>
        <div class="detail-actions">
          <button type="button" id="reserveBtnDetail" class="btn-primary">Reserve for try-on</button>
          <button type="button" id="favoriteBtnDetail" class="btn-secondary">♡ Favourite</button>
        </div>
        <div class="detail-section reservation-status-section" id="reservationStatusSection" style="display: none;">
          <h3>Your reservation status</h3>
          <p class="sub-text" style="margin:0 0 10px; font-size:0.85rem;">Real-time status from the store</p>
          <div id="reservationStatusList" class="reservation-status-list"></div>
          <button type="button" id="refreshReservationStatus" class="btn-secondary" style="margin-top:10px; font-size:0.85rem;">Refresh status</button>
        </div>
        <div class="detail-section">
          <h2>Product Description</h2>
          <p id="productDescription"></p>
        </div>
        <div class="detail-section">
          <h2>Related Products</h2>
          <div id="relatedProducts" class="related-grid"></div>
        </div>
      </div>
    </section>

    <aside class="detail-sidebar">
      <div class="panel">
        <h3>Product Reviews</h3>
        <div id="productReviews" class="reviews-list"></div>
        <form id="productReviewForm" class="review-form">
          <label>Rating</label>
          <div class="star-rating" id="productReviewStars" data-rating="0">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
          </div>
          <textarea id="productReviewComment" placeholder="Share your thoughts about this product…"></textarea>
          <button type="submit" class="btn-primary" style="width:auto; align-self:flex-start; padding-inline:16px; font-size:0.9rem;">Submit review</button>
        </form>
      </div>

      <div class="panel">
        <h3>Store Reviews</h3>
        <div id="storeReviews" class="reviews-list"></div>
        <form id="storeReviewForm" class="review-form">
          <label>Rating</label>
          <div class="star-rating" id="storeReviewStars" data-rating="0">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
          </div>
          <textarea id="storeReviewComment" placeholder="How was your experience with this store?"></textarea>
          <button type="submit" class="btn-primary" style="width:auto; align-self:flex-start; padding-inline:16px; font-size:0.9rem;">Submit store review</button>
        </form>
      </div>
    </aside>
  </main>

  <div class="reserve-modal-overlay" id="reserveModal">
    <div class="reserve-modal">
      <h3>Choose visit date & time</h3>
      <label for="reserveDate">Date</label>
      <input type="date" id="reserveDate" min="">
      <label for="reserveTime">Time</label>
      <select id="reserveTime">
        <option value="9:00 AM">9:00 AM</option>
        <option value="10:00 AM">10:00 AM</option>
        <option value="11:00 AM">11:00 AM</option>
        <option value="12:00 PM">12:00 PM</option>
        <option value="1:00 PM">1:00 PM</option>
        <option value="2:00 PM">2:00 PM</option>
        <option value="3:00 PM">3:00 PM</option>
        <option value="4:00 PM">4:00 PM</option>
        <option value="5:00 PM">5:00 PM</option>
        <option value="6:00 PM">6:00 PM</option>
      </select>
      <div class="reserve-modal-actions">
        <button type="button" class="btn-cancel" id="reserveModalCancel">Cancel</button>
        <button type="button" class="btn-submit" id="reserveModalSubmit">Reserve</button>
      </div>
    </div>
  </div>

  <script>
    let currentProductId = null;
    let favoriteIds = [];

    function getQueryId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    function starsForRating(r) {
      if (!r || r <= 0) return '';
      const rounded = Math.round(r);
      return '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString();
    }

    function renderReviewElement(review) {
      const div = document.createElement('div');
      div.className = 'review-card';
      div.innerHTML = `
        <div class="review-header">
          <div>
            <div class="review-author">${review.userName || 'Customer'}</div>
            <div class="review-date">${formatDate(review.createdAt)}</div>
          </div>
          <div class="stars">${starsForRating(review.rating || 0)}</div>
        </div>
        <div class="review-comment">${(review.comment || '').replace(/</g, '&lt;')}</div>
        ${review.storeReply ? `<div class="review-reply"><strong>Store reply:</strong> ${review.storeReply}</div>` : ''}
      `;
      return div;
    }

    async function loadFavorites() {
      try {
        const res = await fetch('/api/favorites');
        if (res.status === 401) return;
        const data = await res.json();
        favoriteIds = data.favoriteIds || [];
      } catch (e) {
        console.error('Load favorites error:', e);
      }
    }

    function updateFavoriteButton() {
      const btn = document.getElementById('favoriteBtnDetail');
      if (!btn || currentProductId === null) return;
      const idNum = Number(currentProductId);
      const isFav = favoriteIds.includes(idNum);
      btn.classList.toggle('active', isFav);
      btn.textContent = isFav ? '♥ Favourited' : '♡ Favourite';
    }

    async function toggleFavorite() {
      if (currentProductId === null) return;
      const idNum = Number(currentProductId);
      const isFav = favoriteIds.includes(idNum);
      try {
        if (isFav) {
          const res = await fetch('/api/favorites/' + idNum, { method: 'DELETE' });
          if (res.ok) {
            const data = await res.json();
            favoriteIds = data.favoriteIds || [];
          }
        } else {
          const res = await fetch('/api/favorites', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ productId: idNum })
          });
          if (res.status === 401) {
            alert('Please sign in to add favourites.');
            return;
          }
          if (res.ok) {
            const data = await res.json();
            favoriteIds = data.favoriteIds || [];
          }
        }
        updateFavoriteButton();
      } catch (err) {
        console.error('Favorite toggle error:', err);
      }
    }

    async function loadProductDetail() {
      const id = getQueryId();
      if (!id) {
        alert('No product specified.');
        return;
      }
      currentProductId = id;
      await loadFavorites();
      updateFavoriteButton();

      try {
        const res = await fetch('/api/products/' + encodeURIComponent(id));
        if (!res.ok) {
          alert('Could not load product.');
          return;
        }
        const data = await res.json();
        const { product, inventoryLeft, productRating, storeRating, productReviews, storeReviews, relatedProducts } = data;

        const img = document.getElementById('productImage');
        img.src = product.images || '';
        img.onerror = function() {
          this.src = 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect fill=%22%23eee%22 width=%22200%22 height=%22200%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22>No image</text></svg>';
        };

        document.getElementById('productTitle').textContent = product.title || 'Product';
        document.getElementById('productStore').textContent = product.store_name ? 'Sold by ' + product.store_name : '';
        document.getElementById('productCategoryTag').textContent = (product.category || '').toUpperCase() || 'PRODUCT';

        const priceText = typeof product.price === 'number' ? product.price.toFixed(2) : (product.price || '0.00');
        document.getElementById('productPrice').textContent = '$' + priceText;

        const invEl = document.getElementById('inventoryText');
        if (inventoryLeft <= 0) {
          invEl.textContent = 'Out of stock';
          invEl.className = 'inventory empty';
        } else if (inventoryLeft <= 3) {
          invEl.textContent = 'Only ' + inventoryLeft + ' left in stock';
          invEl.className = 'inventory low';
        } else {
          invEl.textContent = inventoryLeft + ' in stock';
          invEl.className = 'inventory';
        }

        const reserveBtn = document.getElementById('reserveBtnDetail');
        reserveBtn.disabled = inventoryLeft <= 0;
        reserveBtn.dataset.productId = product.id;
        reserveBtn.dataset.price = product.price;

        const prStars = document.getElementById('productRatingStars');
        const prText = document.getElementById('productRatingText');
        if (productRating && productRating.count > 0) {
          prStars.textContent = starsForRating(productRating.average);
          prText.textContent = productRating.average.toFixed(1) + ' (' + productRating.count + ' reviews)';
        } else {
          prStars.textContent = '';
          prText.textContent = 'No product reviews yet';
        }

        const srText = document.getElementById('storeRatingText');
        if (storeRating && storeRating.count > 0) {
          srText.textContent = 'Store: ' + storeRating.average.toFixed(1) + ' (' + storeRating.count + ' reviews)';
        } else {
          srText.textContent = '';
        }

        document.getElementById('productDescription').textContent = product.description || 'No description available.';

        const prList = document.getElementById('productReviews');
        prList.innerHTML = '';
        if (productReviews && productReviews.length) {
          productReviews.forEach(r => prList.appendChild(renderReviewElement(r)));
        } else {
          prList.innerHTML = '<p style="font-size:0.85rem; color:#6b7280;">No product reviews yet.</p>';
        }

        const srList = document.getElementById('storeReviews');
        srList.innerHTML = '';
        if (storeReviews && storeReviews.length) {
          storeReviews.forEach(r => srList.appendChild(renderReviewElement(r)));
        } else {
          srList.innerHTML = '<p style="font-size:0.85rem; color:#6b7280;">No store reviews yet.</p>';
        }

        const relWrap = document.getElementById('relatedProducts');
        relWrap.innerHTML = '';
        if (relatedProducts && relatedProducts.length) {
          const placeholderImg = 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect fill=%22%23eee%22 width=%22200%22 height=%22200%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22>No image</text></svg>';
          relatedProducts.forEach(item => {
            const card = document.createElement('div');
            card.className = 'related-card';
            const imgSrc = item.images || placeholderImg;
            card.innerHTML = `
              <img class="related-card-img" src="${imgSrc}" alt="${item.title || 'Product'}" onerror="this.src='${placeholderImg}'">
              <div class="related-card-title">${item.title || 'Product'}</div>
              <div class="related-card-price">$${(typeof item.price === 'number' ? item.price.toFixed(2) : (item.price || '0.00'))}</div>
              <div style="font-size:0.8rem; color:#6b7280;">${item.store_name || ''}</div>
            `;
            card.addEventListener('click', () => {
              window.location.href = '/product.html?id=' + encodeURIComponent(item.id);
            });
            relWrap.appendChild(card);
          });
        } else {
          relWrap.innerHTML = '<p style="font-size:0.85rem; color:#6b7280;">No related products found.</p>';
        }

        document.getElementById('storeReviewForm').dataset.storeId = product.store_id || '';
        document.getElementById('storeReviewForm').dataset.storeName = product.store_name || '';

        loadReservationStatus();
      } catch (err) {
        console.error('Load product error:', err);
        alert('Could not load product.');
      }
    }

    function openReserveModal() {
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('reserveDate').setAttribute('min', today);
      document.getElementById('reserveModal').classList.add('open');
    }
    function closeReserveModal() {
      document.getElementById('reserveModal').classList.remove('open');
    }

    async function reserveFromDetail() {
      const btn = document.getElementById('reserveBtnDetail');
      if (btn.disabled) return;
      const productId = btn.dataset.productId;
      if (!productId) return;
      openReserveModal();
    }

    async function submitReserveWithDateTime() {
      const btn = document.getElementById('reserveBtnDetail');
      const productId = btn.dataset.productId;
      const dateEl = document.getElementById('reserveDate');
      const timeEl = document.getElementById('reserveTime');
      const preferredDate = dateEl.value;
      const preferredTime = timeEl.value;
      if (!preferredDate) {
        alert('Please choose a date to visit the store.');
        return;
      }
      closeReserveModal();
      try {
        const res = await fetch('/api/reservations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId, quantity: 1, preferredDate, preferredTime })
        });
        if (res.status === 401) {
          alert('Please sign in to reserve.');
          return;
        }
        const data = await res.json();
        if (!res.ok) {
          if (typeof data.inventoryLeft === 'number' && data.inventoryLeft === 0) {
            btn.disabled = true;
            btn.textContent = 'Out of stock';
            document.getElementById('inventoryText').textContent = 'Out of stock';
            document.getElementById('inventoryText').className = 'inventory empty';
          }
          alert(data.error || 'Could not reserve this item.');
          return;
        }
        if (typeof data.inventoryLeft === 'number') {
          const invEl = document.getElementById('inventoryText');
          if (data.inventoryLeft <= 0) {
            invEl.textContent = 'Out of stock';
            invEl.className = 'inventory empty';
            btn.disabled = true;
            btn.textContent = 'Out of stock';
          } else if (data.inventoryLeft <= 3) {
            invEl.textContent = 'Only ' + data.inventoryLeft + ' left in stock';
            invEl.className = 'inventory low';
          } else {
            invEl.textContent = data.inventoryLeft + ' in stock';
            invEl.className = 'inventory';
          }
        }
        alert('Reserved! You will earn loyalty points when the store confirms your purchase. Check "Your reservation status" for updates.');
        loadReservationStatus();
      } catch (err) {
        console.error('Reserve error:', err);
        alert('Error while reserving.');
      }
    }

    async function loadReservationStatus() {
      const section = document.getElementById('reservationStatusSection');
      const list = document.getElementById('reservationStatusList');
      if (!section || !list) return;
      try {
        const res = await fetch('/api/my-reservations');
        if (res.status === 401) {
          section.style.display = 'none';
          return;
        }
        const reservations = await res.json();
        const forThisProduct = currentProductId
          ? reservations.filter(r => String(r.productId) === String(currentProductId))
          : reservations;
        if (forThisProduct.length === 0) {
          section.style.display = 'none';
          return;
        }
        section.style.display = 'block';
        list.innerHTML = forThisProduct.map(r => {
          const d = r.preferredDate ? formatDate(r.preferredDate) : '—';
          const t = r.preferredTime || '—';
          const status = (r.status || 'pending').toLowerCase();
          return `
            <div class="reservation-status-item">
              <div>
                <strong>${r.productTitle || 'Item'}</strong> · ${r.store_name || 'Store'}<br>
                <span class="sub-text">Visit: ${d} at ${t}</span>
              </div>
              <span class="status-badge ${status}">${(r.status || 'pending').toUpperCase()}</span>
            </div>
          `;
        }).join('');
      } catch (e) {
        section.style.display = 'none';
      }
    }

    function setupStarRating(containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const stars = container.querySelectorAll('.star');
      const updateDisplay = (val) => {
        stars.forEach((s, i) => s.classList.toggle('filled', i < val));
      };
      stars.forEach(star => {
        star.addEventListener('click', (e) => {
          e.preventDefault();
          const val = Number(star.getAttribute('data-value'));
          container.dataset.rating = val;
          updateDisplay(val);
        });
        star.addEventListener('mouseenter', () => updateDisplay(Number(star.getAttribute('data-value'))));
      });
      container.addEventListener('mouseleave', () => updateDisplay(Number(container.dataset.rating || 0)));
    }

    function getProductReviewRating() {
      return Number(document.getElementById('productReviewStars').dataset.rating || 0);
    }
    function getStoreReviewRating() {
      return Number(document.getElementById('storeReviewStars').dataset.rating || 0);
    }

    async function submitProductReview(e) {
      e.preventDefault();
      if (!currentProductId) return;
      const rating = getProductReviewRating();
      if (!rating || rating < 1) {
        alert('Please select a rating by clicking the stars.');
        return;
      }
      const comment = document.getElementById('productReviewComment').value.trim();
      try {
        const res = await fetch('/api/products/' + encodeURIComponent(currentProductId) + '/reviews', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rating, comment })
        });
        if (res.status === 401) {
          alert('Please sign in to leave a review.');
          return;
        }
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alert(data.error || 'Could not submit review.');
          return;
        }
        document.getElementById('productReviewComment').value = '';
        document.getElementById('productReviewStars').dataset.rating = '0';
        document.getElementById('productReviewStars').querySelectorAll('.star').forEach(s => s.classList.remove('filled'));
        loadProductDetail();
      } catch (err) {
        console.error('Submit product review error:', err);
      }
    }

    async function submitStoreReview(e) {
      e.preventDefault();
      const form = document.getElementById('storeReviewForm');
      const storeId = form.dataset.storeId;
      const storeName = form.dataset.storeName;
      if (!storeId && !storeName) {
        alert('Store information missing.');
        return;
      }
      const rating = getStoreReviewRating();
      if (!rating || rating < 1) {
        alert('Please select a rating by clicking the stars.');
        return;
      }
      const comment = document.getElementById('storeReviewComment').value.trim();
      try {
        const url = storeId ? '/api/stores/' + encodeURIComponent(storeId) + '/reviews' : '/api/stores/unknown/reviews';
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rating, comment, storeName })
        });
        if (res.status === 401) {
          alert('Please sign in to leave a review.');
          return;
        }
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alert(data.error || 'Could not submit store review.');
          return;
        }
        document.getElementById('storeReviewComment').value = '';
        document.getElementById('storeReviewStars').dataset.rating = '0';
        document.getElementById('storeReviewStars').querySelectorAll('.star').forEach(s => s.classList.remove('filled'));
        loadProductDetail();
      } catch (err) {
        console.error('Submit store review error:', err);
      }
    }

    document.getElementById('reserveBtnDetail').addEventListener('click', reserveFromDetail);
    document.getElementById('favoriteBtnDetail').addEventListener('click', toggleFavorite);
    document.getElementById('productReviewForm').addEventListener('submit', submitProductReview);
    document.getElementById('storeReviewForm').addEventListener('submit', submitStoreReview);
    document.getElementById('reserveModalCancel').addEventListener('click', closeReserveModal);
    document.getElementById('reserveModalSubmit').addEventListener('click', submitReserveWithDateTime);
    document.getElementById('reserveModal').addEventListener('click', function(e) {
      if (e.target.id === 'reserveModal') closeReserveModal();
    });
    document.getElementById('refreshReservationStatus').addEventListener('click', loadReservationStatus);

    setupStarRating('productReviewStars');
    setupStarRating('storeReviewStars');

    loadProductDetail();
  </script>
</body>
</html>
