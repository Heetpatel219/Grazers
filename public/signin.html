<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>

    <link rel="stylesheet" href="signin.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="auth-card">
        <h1>Welcome Back</h1>
        <p class="tagline">Sign in to your account</p>

        <form id="signinForm">
            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required />
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required />
            </div>

            <button type="submit">Sign In</button>
        </form>

        <div style="margin-top: 25px; border-top: 1px solid #e5e7eb; padding-top: 20px;">
            <p style="font-size: 0.8rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 12px;">Demo Quick Sign In</p>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button type="button" id="quickCustomerBtn" style="background: linear-gradient(135deg, #10b981, #059669); font-weight: 600; font-size: 0.85rem; padding: 10px; margin-top: 0; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.15); border-radius: 10px;">Customer</button>
                <button type="button" id="quickOwnerBtn" style="background: linear-gradient(135deg, #3b82f6, #2563eb); font-weight: 600; font-size: 0.85rem; padding: 10px; margin-top: 0; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.15); border-radius: 10px;">Business</button>
            </div>
        </div>

        <p id="message"></p>

        <p class="switch">
            Don't have an account?
            <a href="/signup">Sign Up</a>
        </p>
    </div>

    <script>
        // Handle sign-in form submission: post credentials and redirect based on user type
        document.getElementById('signinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');

            try {
                const response = await fetch('/signin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                messageEl.textContent = data.message;
                messageEl.style.color = response.ok ? 'green' : 'red';

                if (response.ok) {
                    // Owners go to the analytics dashboard; regular users return to the storefront
                    if (data.isOwner) {
                        setTimeout(() => {
                            window.location.href = '/ownerhome.html';
                        }, 1000);
                    } else {
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1000);
                    }
                }
            } catch (error) {
                messageEl.textContent = 'Error: ' + error.message;
                messageEl.style.color = 'red';
            }
        });

        const handleQuickLogin = (email, password) => {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            // Dispatch a submit event on the form to run the regular sign-in handler
            const form = document.getElementById('signinForm');
            const submitEvent = new Event('submit', { cancelable: true, bubbles: true });
            form.dispatchEvent(submitEvent);
        };

        document.getElementById('quickCustomerBtn').addEventListener('click', () => handleQuickLogin('customer@example.com', 'password'));
        document.getElementById('quickOwnerBtn').addEventListener('click', () => handleQuickLogin('owner@example.com', 'password'));
    </script>

</body>

</html>
