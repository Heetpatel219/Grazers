<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grazers | All Stores</title>
  <link rel="stylesheet" href="home.css" />
  <link rel="stylesheet" href="notifications.css" />
  <style>
    .allStoresContainer {
      padding: 40px 0;
    }
    .allStoresGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }
    .pageHeader {
      margin-bottom: 40px;
      text-align: center;
    }
    .pageHeader h1 {
      font-size: 42px;
      font-family: Georgia, serif;
      color: #0b7a58;
      margin: 0 0 10px;
    }
    .pageHeader p {
      font-size: 18px;
      color: rgba(16, 32, 24, 0.6);
    }
    /* Override .shopCard specific styles heavily locked to horizontal list */
    .allStoresGrid .shopCard {
      flex: none;
      max-width: none;
      height: 100%;
      scroll-snap-align: none;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brandIcon">G</div>
      <div class="brandText">
        <div class="brandName">Grazers</div>
        <div class="brandTag">FASHION COLLECTION</div>
      </div>
    </div>
    <div class="topIcons">
      <a class="topLink" href="/">Home</a>
      <span id="userInfo" style="display: none;">
        <span id="userName"></span>
        <a class="topLink" href="#" onclick="logout(event)">Sign Out</a>
      </span>
      <a class="iconBubble" href="/cart.html" style="display:flex; align-items:center; gap:6px;" title="Your Cart">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        <span id="cartCount">0</span>
      </a>
      <a class="iconBubble profileLink" href="/profile" id="profileLink" style="display: none;">User Profile</a>
    </div>
  </header>

  <main class="layout" style="grid-template-columns: 1fr;">
    <section class="main allStoresContainer">
      <div class="pageHeader">
        <h1>All Stores</h1>
        <p>Explore our highly curated selection of premium retail partners.</p>
      </div>

      <div class="allStoresGrid" id="allStoresGrid">
        <p class="loadingText">Loading stores…</p>
      </div>
    </section>
  </main>

  <script src="notifications.js"></script>
  <script>

    /**
     * Core Client Function: checkAuth
     * Standardizes layout handling and logical rendering parameters natively.
     */
    async function checkAuth() {
      try {
        const response = await fetch('/api/check-auth');
        const data = await response.json();
        const userInfo = document.getElementById('userInfo');
        const userName = document.getElementById('userName');

        if (data.isLoggedIn) {
          document.getElementById('profileLink').style.display = 'inline-flex';
          userName.textContent = data.userName || 'User';
          userInfo.style.display = 'inline';
          await loadCartCount();
        } else {
          userInfo.style.display = 'none';
        }
      } catch (error) {
        console.error('Error checking auth:', error);
      }
    }

    /**
     * Core Client Function: loadCartCount
     * Standardizes layout handling and logical rendering parameters natively.
     */
    async function loadCartCount() {
      try {
        const res = await fetch('/api/cart');
        if (res.status === 401) return;
        const products = await res.json();
        const n = products.length || 0;
        const el = document.getElementById('cartCount');
        if (el) el.textContent = n;
      } catch (e) { }
    }

    /**
     * Core Client Function: loadAllShops
     * Standardizes layout handling and logical rendering parameters natively.
     */
    async function loadAllShops() {
      const grid = document.getElementById('allStoresGrid');
      try {
        const response = await fetch('/api/shops-from-products');
        const shops = await response.json();
        grid.innerHTML = '';
        if (shops.length === 0) {
          grid.innerHTML = '<p class="emptyHint">No stores found.</p>';
          return;
        }

        shops.forEach(shop => {
          const name = shop.name || 'Shop';
          const count = shop.productCount || 0;
          const todayIndex = new Date().getDay() === 0 ? 'sunday' : ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'][new Date().getDay()];
          const todayHours = (shop.hours && shop.hours[todayIndex]) ? shop.hours[todayIndex] : '9:00 AM - 9:00 PM';
          const imageSrc = shop.image || 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=600&q=80';
          const desc = shop.description || `Welcome to ${name}`;
          
          grid.insertAdjacentHTML('beforeend', `
            <a href="/store.html?store_id=${encodeURIComponent(shop.store_id || name)}" class="shopCard">
              <img src="${imageSrc}" class="shopCardImage" alt="${name}" loading="lazy">
              <div class="shopCardContent">
                <div class="shopCardHeader">
                  <strong>${name}</strong>
                  <span>${count} items</span>
                </div>
                <div class="shopCardDesc">${desc}</div>
                <div class="shopCardHours">Open Today: ${todayHours}</div>
              </div>
            </a>
          `);
        });
      } catch (err) {
        console.error('Failed to load shops:', err);
        grid.innerHTML = '<p class="emptyHint">Error loading stores.</p>';
      }
    }

    /**
     * Core Client Function: logout
     * Standardizes layout handling and logical rendering parameters natively.
     */
    async function logout(e) {
      e.preventDefault();
      await fetch('/logout', { method: 'POST' });
      window.location.reload();
    }

    (async function init() {
      await checkAuth();
      await loadAllShops();
    })();
  
</script>
</body>
</html>
