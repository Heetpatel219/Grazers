<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Fashion Hub</title>

    <!-- Link to CSS -->
    <link rel="stylesheet" href="signup.css" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="auth-card">
        <h1>Create Account</h1>
        <p class="tagline">Join us and start shopping</p>

        <form id="signupForm">
            <div class="field">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required />
            </div>

            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required />
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required />
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password"
                    required />
            </div>

            <div class="field">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Optional" />
            </div>

            <div class="field">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Optional" />
            </div>

            <div class="field checkbox-field">
                <input type="checkbox" id="terms" name="terms" required />
                <label for="terms">I agree to the Terms & Conditions</label>
            </div>

            <button type="submit">Sign Up</button>
        </form>

        <p id="message"></p>

        <p class="switch">
            Already have an account?
            <a href="/signin">Sign In</a>
        </p>
    </div>

    <!-- JS logic for signup -->
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Optional: password confirmation check
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (password !== confirmPassword) {
                const messageEl = document.getElementById('message');
                messageEl.textContent = 'Passwords do not match';
                messageEl.style.color = 'red';
                return;
            }

            const name = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;

            const messageEl = document.getElementById('message');

            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, password }) // backend still only needs name/password
                });

                const data = await response.json();
                messageEl.textContent = data.message;
                messageEl.style.color = response.ok ? 'green' : 'red';

                if (response.ok) {
                    setTimeout(() => { window.location.href = '/signin'; }, 1500);
                }
            } catch (error) {
                messageEl.textContent = 'Error: ' + error.message;
                messageEl.style.color = 'red';
            }
        });
    </script>

</body>

</html>
